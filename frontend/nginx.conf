# PitchPilot web tier: static SPA + reverse proxy for the API (and WebSockets).
#
# TLS terminates at your edge/load balancer (or add certs here). The proxy
# passes the WebSocket Upgrade handshake through untouched and disables
# buffering so live cues arrive immediately.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), display-capture=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Same-origin deployment: nginx proxies /api and /api/ws, so the browser
    # never needs a wildcard ws:/wss: source. If you split the frontend and
    # API onto different origins, add those exact origins here (never *).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # JSON/API requests are capped in the app; keep nginx from buffering a
    # multi-gigabyte upload before FastAPI can reject it.
    client_max_body_size 2m;

    # ── Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/wasm;

    # ── Health probe (used by Docker/compose) ────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API + WebSocket reverse proxy ────────────────────────────────
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so a client-supplied header cannot spoof its IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Live streams are long-lived; keep them open and unbuffered.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Hashed build assets: immutable long cache ────────────────────
    # `expires` (not add_header) so the security headers above stay inherited.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # ── SPA fallback ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;   # Cache-Control: no-cache
    }
}
